services:
  postgres:
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE to an approved immutable PostgreSQL image}
    restart: unless-stopped
    environment:
      POSTGRES_DB: tandem
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - tandem_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  verifier:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - tandem_ed25519_seed
    volumes:
      - ${TANDEM_PROTOCOL_DIR:?set TANDEM_PROTOCOL_DIR}:/protocol:ro
    ports:
      - "127.0.0.1:${TANDEM_HTTP_PORT:-8088}:8088"
    extra_hosts:
      - "host.docker.internal:host-gateway"

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:?set POSTGRES_PASSWORD_FILE}
  tandem_ed25519_seed:
    file: ${TANDEM_SIGNING_KEY_FILE_HOST:?set TANDEM_SIGNING_KEY_FILE_HOST}

volumes:
  tandem_postgres:

