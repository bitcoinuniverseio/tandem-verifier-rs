name: ci

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install pinned toolchain
        shell: pwsh
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo +1.97.1 fmt --all -- --check
      - name: Clippy
        run: cargo +1.97.1 clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo +1.97.1 test --workspace --all-features
      - name: Release build
        run: cargo +1.97.1 build --workspace --release --locked
