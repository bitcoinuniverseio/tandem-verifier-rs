name: ci

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  route:
    uses: ./.github/workflows/route.yml
    secrets: inherit
    with:
      plan: '{"rust":"standard"}'
      config_ref: 1dd19289af21f4f6be01f874390a180b3af8bb38

  # This workspace has no Windows-specific code and the approved runner
  # architecture offers no Windows cloud capacity, so the checks run on Linux.
  rust:
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.targets).rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo +1.97.1 fmt --all -- --check
      - name: Clippy
        run: cargo +1.97.1 clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo +1.97.1 test --workspace --all-features
      - name: Release build
        run: cargo +1.97.1 build --workspace --release --locked
