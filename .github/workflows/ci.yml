name: ci

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    runs-on: runs-on=${{ github.run_id }}-rust/runner=universe-windows/cpu=4+16/env=production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        shell: pwsh
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo +1.97.1 fmt --all -- --check
      - name: Clippy
        run: cargo +1.97.1 clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo +1.97.1 test --workspace --all-features
      - name: Release build
        run: cargo +1.97.1 build --workspace --release --locked
