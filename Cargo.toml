[workspace]
members = [
  "crates/tandem-core",
  "crates/tandem-verifier",
  "crates/tandem-cli",
]
resolver = "3"
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/bitcoinuniverseio/tandem-verifier-rs"
rust-version = "1.97"

[workspace.dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
axum = { version = "0.8.8", features = ["json", "macros"] }
bitcoin = { version = "0.32.8", features = ["serde"] }
clap = { version = "4.5.54", features = ["derive", "env"] }
ed25519-dalek = { version = "2.2.0", features = ["pkcs8", "rand_core"] }
hex = { version = "0.4.3", features = ["serde"] }
proptest = "1.9.0"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
secp256k1 = { version = "0.29.1", features = ["global-context"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_jcs = "0.1.0"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "migrate", "macros", "json"] }
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
url = "2.5.8"
zeroize = "1.8.2"
zeromq = "0.4.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = "symbols"
